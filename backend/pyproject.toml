[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "career-scout-agents"
version = "0.1.0"
description = "Explicit Master/Profile orchestration and typed agent contracts for Career Scout"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["langgraph==1.2.18", "pydantic>=2.12,<3"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
career-scout-agents = "career_scout.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
